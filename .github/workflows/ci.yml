name: CI

# Phase-1 quality gate. Blocks merge to main if any job fails.
# - quality: typecheck + lint + build + commitlint (PR only)
# - test:    vitest with a real Postgres + Redis service container
#
# e2e job will be added in Phase 2 once apps/web exists (per ADR-005).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.19'
  PNPM_VERSION: '10.33.0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so commitlint can compare against origin/main.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Required before typecheck — @dentabill/db's lib/with-org.ts uses
        # generated extension types from @prisma/client. pnpm v10 only runs
        # postinstall for deps in onlyBuiltDependencies, but we run it
        # explicitly so the gate doesn't depend on that allowlist staying
        # in sync.
        run: pnpm --filter @dentabill/db exec prisma generate

      - name: Lint commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from=origin/${{ github.base_ref }} --to=HEAD --verbose

      - name: Typecheck (turbo)
        run: pnpm turbo run typecheck

      - name: Lint (turbo)
        run: pnpm turbo run lint

      - name: Build (turbo)
        run: pnpm turbo run build

      - name: Format check
        run: pnpm exec prettier --check .

  test:
    name: Test (vitest + real Postgres)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentabill
          POSTGRES_PASSWORD: dentabill
          POSTGRES_DB: dentabill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentabill -d dentabill_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dentabill:dentabill@localhost:5432/dentabill_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for services
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U dentabill && break || sleep 2
          done
          for i in {1..30}; do
            (echo > /dev/tcp/localhost/6379) >/dev/null 2>&1 && break || sleep 2
          done

      - name: Generate Prisma client
        run: pnpm --filter @dentabill/db exec prisma generate

      - name: Apply Prisma migrations to test database
        run: pnpm --filter @dentabill/db exec prisma migrate deploy

      - name: Test (turbo)
        run: pnpm turbo run test
