<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">DentaBill claim lifecycle</title>
  <desc id="d">Claim states. The automated path: PENDING to IN_QUEUE when a biller starts a call, IN_QUEUE to CALLING when the worker takes the lease, CALLING to COMPLETED, DENIED or MANUAL_REVIEW when the call ends, and COMPLETED to RESOLVED, NEEDS_INFO or MANUAL_REVIEW from the summary policy. A table lists the biller-driven transitions the API validates.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/>
    </marker>
    <marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0F172A; }
      .h1 { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #475569; }
      .sec { font-size: 15px; font-weight: 700; }
      .state { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #334155; }
      .monoB { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #0F172A; }
      .small { font-size: 12px; fill: #475569; }
      .lbl { font-size: 12px; fill: #1E293B; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke; }
      .st { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
      .live { fill: #FFF7EB; stroke: #FF9900; stroke-width: 2; }
      .term { fill: #F0FDF4; stroke: #16A34A; stroke-width: 2; }
      .attn { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; }
      .edge { fill: none; stroke: #0F172A; stroke-width: 2; }
      .edgeMuted { fill: none; stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .rule { stroke: #E2E8F0; stroke-width: 1; }
      .zebra { fill: #F8FAFC; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" rx="16" fill="#FFFFFF"/>

  <text x="24" y="40" class="h1">Claim lifecycle</text>
  <text x="24" y="63" class="sub">Claim.status (11 values, @dentabill/types). Solid arrows are written by the pipeline; the table lists what a biller may change through the API.</text>

  <text x="30" y="98" class="sec">Automated path</text>

  <!-- states -->
  <rect x="40" y="232" width="140" height="46" rx="23" class="st"/>
  <text x="110" y="260" class="state" text-anchor="middle">PENDING</text>

  <rect x="240" y="232" width="140" height="46" rx="23" class="live"/>
  <text x="310" y="260" class="state" text-anchor="middle">IN_QUEUE</text>

  <rect x="440" y="232" width="140" height="46" rx="23" class="live"/>
  <text x="510" y="260" class="state" text-anchor="middle">CALLING</text>

  <rect x="660" y="128" width="150" height="46" rx="23" class="st"/>
  <text x="735" y="156" class="state" text-anchor="middle">COMPLETED</text>

  <rect x="660" y="338" width="150" height="46" rx="23" class="attn"/>
  <text x="735" y="366" class="state" text-anchor="middle">DENIED</text>

  <rect x="960" y="100" width="170" height="46" rx="23" class="term"/>
  <rect x="964" y="104" width="162" height="38" rx="19" fill="none" stroke="#16A34A" stroke-width="1"/>
  <text x="1045" y="128" class="state" text-anchor="middle">RESOLVED</text>

  <rect x="960" y="176" width="170" height="46" rx="23" class="st"/>
  <text x="1045" y="204" class="state" text-anchor="middle">NEEDS_INFO</text>

  <rect x="960" y="276" width="170" height="46" rx="23" class="attn"/>
  <text x="1045" y="304" class="state" text-anchor="middle">MANUAL_REVIEW</text>

  <!-- automated edges -->
  <line x1="180" y1="255" x2="238" y2="255" class="edge" marker-end="url(#arr)"/>
  <text x="209" y="224" class="lbl" text-anchor="middle">Call now</text>
  <text x="209" y="240" class="small" text-anchor="middle">(API)</text>

  <line x1="380" y1="255" x2="438" y2="255" class="edge" marker-end="url(#arr)"/>
  <text x="409" y="224" class="lbl" text-anchor="middle">lease</text>
  <text x="409" y="240" class="small" text-anchor="middle">(worker)</text>

  <path d="M550,232 V151 H658" class="edge" marker-end="url(#arr)"/>
  <text x="560" y="140" class="lbl">call ended</text>

  <path d="M550,278 V361 H658" class="edge" marker-end="url(#arr)"/>
  <text x="560" y="396" class="lbl">payer reported denial</text>

  <path d="M580,262 L958,302" class="edge" marker-end="url(#arr)"/>
  <text x="604" y="304" class="lbl">no answer / busy / error,</text>
  <text x="604" y="321" class="lbl">3rd failed attempt, operator cancel</text>

  <path d="M810,144 L958,124" class="edge" marker-end="url(#arr)"/>
  <text x="884" y="118" class="lbl" text-anchor="middle">RESOLVED</text>
  <path d="M810,158 L958,196" class="edge" marker-end="url(#arr)"/>
  <text x="884" y="166" class="lbl" text-anchor="middle">SUBMIT_DOCS</text>
  <path d="M800,174 L958,288" class="edge" marker-end="url(#arr)"/>
  <text x="884" y="222" class="lbl" text-anchor="middle">otherwise</text>
  <text x="884" y="94" class="small" text-anchor="middle">summary policy (confidence ≥ 0.95)</text>

  <!-- biller re-queue -->
  <path d="M1045,322 V430 H310 V280" class="edgeMuted" marker-end="url(#arrMuted)"/>
  <text x="420" y="424" class="lbl">biller re-queues for another call (from NEEDS_INFO, MANUAL_REVIEW, FAILED, …)</text>

  <text x="40" y="314" class="small">Live states: the dashboard shows</text>
  <text x="40" y="331" class="small">IN_QUEUE / CALLING as "on a call".</text>

  <line x1="24" y1="460" x2="1176" y2="460" class="rule"/>

  <!-- table -->
  <text x="30" y="490" class="sec">Biller-driven transitions</text>
  <text x="230" y="490" class="small">validated by PATCH /v1/claims/:id against CLAIM_STATE_TRANSITIONS (apps/api/src/lib/claim-state.ts); self-transitions always allowed</text>

  <rect x="30" y="504" width="560" height="26" class="zebra"/>
  <text x="44" y="522" class="monoB">PENDING</text><text x="190" y="522" class="mono">→ IN_QUEUE, MANUAL_REVIEW, WRITTEN_OFF</text>
  <text x="44" y="548" class="monoB">IN_QUEUE</text><text x="190" y="548" class="mono">→ CALLING, PENDING, MANUAL_REVIEW</text>
  <rect x="30" y="556" width="560" height="26" class="zebra"/>
  <text x="44" y="574" class="monoB">CALLING</text><text x="190" y="574" class="mono">→ COMPLETED, FAILED, MANUAL_REVIEW</text>
  <text x="44" y="600" class="monoB">COMPLETED</text><text x="190" y="600" class="mono">→ IN_QUEUE, RESOLVED, DENIED,</text>
  <text x="190" y="618" class="mono">  NEEDS_INFO, APPEALING</text>
  <rect x="30" y="626" width="560" height="26" class="zebra"/>
  <text x="44" y="644" class="monoB">DENIED</text><text x="190" y="644" class="mono">→ APPEALING, WRITTEN_OFF, MANUAL_REVIEW</text>

  <text x="624" y="522" class="monoB">NEEDS_INFO</text><text x="780" y="522" class="mono">→ IN_QUEUE, MANUAL_REVIEW</text>
  <rect x="610" y="530" width="560" height="26" class="zebra"/>
  <text x="624" y="548" class="monoB">APPEALING</text><text x="780" y="548" class="mono">→ IN_QUEUE, RESOLVED, DENIED</text>
  <text x="624" y="574" class="monoB">FAILED</text><text x="780" y="574" class="mono">→ IN_QUEUE, MANUAL_REVIEW</text>
  <rect x="610" y="582" width="560" height="44" class="zebra"/>
  <text x="624" y="600" class="monoB">MANUAL_REVIEW</text><text x="780" y="600" class="mono">→ IN_QUEUE, RESOLVED, DENIED,</text>
  <text x="780" y="618" class="mono">  WRITTEN_OFF</text>
  <text x="624" y="644" class="monoB">RESOLVED</text><text x="780" y="644" class="mono">terminal</text>
  <rect x="610" y="652" width="560" height="26" class="zebra"/>
  <text x="624" y="670" class="monoB">WRITTEN_OFF</text><text x="780" y="670" class="mono">terminal</text>

  <text x="30" y="712" class="small">Workers write their transitions with org-scoped conditional updates rather than through this table, which is why the automated path includes</text>
  <text x="30" y="730" class="small">CALLING → DENIED and COMPLETED → MANUAL_REVIEW. Each automated claim transition from a summary also writes a claim.transition audit row.</text>
</svg>
