name: CI

# Quality gates for every PR + push to main. Blocks merge if any required
# job fails (or the gating `changes` job decides to skip a job).
#
# Job map:
#   - changes:    computes which file groups changed; outputs feed `if:`
#                 gates on the heavy jobs below
#   - quality:    typecheck + lint + build + format + commitlint —
#                 ALWAYS runs (cheapest source-of-truth gate)
#   - test:       vitest with real Postgres + Redis — runs when code
#                 changed (skipped on docs-only PRs)
#   - e2e:        Playwright + axe + visual — runs when web surface
#                 changed (skipped for package-only / api-only PRs)
#   - bundle:     bundle budget — runs when web surface changed
#   - lighthouse: perf + a11y + SEO — runs when web surface changed
#
# Skipped jobs report a `skipped` conclusion which GitHub branch
# protection treats as success — required-checks stay enforced without
# burning runner minutes on irrelevant work.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.19'
  PNPM_VERSION: '10.33.0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute change scope
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # `web`  → triggers e2e + bundle + lighthouse. Includes apps/web
          #          plus everything its bundle / e2e tests depend on:
          #          apps/api (e2e hits /v1/contact + /v1/me),
          #          packages/{ui, types, api-sdk, config}.
          #          NOT included: db, logger, payer-ivr, queue — those
          #          flow through the api boundary and are caught by the
          #          test job's real-Postgres integration suite.
          # `code` → triggers test (any source / config / lockfile change).
          # Workflow files are in both groups so CI changes always run
          # end-to-end.
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/api/**'
              - 'packages/ui/**'
              - 'packages/types/**'
              - 'packages/api-sdk/**'
              - 'packages/config/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.github/workflows/**'
            code:
              - 'apps/**'
              - 'packages/**'
              - '**/*.{ts,tsx,js,mjs,cjs}'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - 'turbo.json'
              - 'vitest.config.*'
              - 'eslint.config.*'
              - 'prettier.config.*'
              - '.github/workflows/**'

  quality:
    name: Quality (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so commitlint can compare against origin/main.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # Required before typecheck — @dentabill/db's lib/with-org.ts uses
        # generated extension types from @prisma/client. pnpm v10 only runs
        # postinstall for deps in onlyBuiltDependencies, but we run it
        # explicitly so the gate doesn't depend on that allowlist staying
        # in sync.
        run: pnpm --filter @dentabill/db exec prisma generate

      - name: Lint commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from=origin/${{ github.base_ref }} --to=HEAD --verbose

      - name: Typecheck (turbo)
        run: pnpm turbo run typecheck

      - name: Lint (turbo)
        run: pnpm turbo run lint

      - name: Build (turbo)
        run: pnpm turbo run build

      - name: Format check
        run: pnpm exec prettier --check .

  test:
    name: Test (vitest + real Postgres)
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentabill
          POSTGRES_PASSWORD: dentabill
          POSTGRES_DB: dentabill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentabill -d dentabill_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dentabill:dentabill@localhost:5432/dentabill_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for services
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U dentabill && break || sleep 2
          done
          for i in {1..30}; do
            (echo > /dev/tcp/localhost/6379) >/dev/null 2>&1 && break || sleep 2
          done

      - name: Generate Prisma client
        run: pnpm --filter @dentabill/db exec prisma generate

      - name: Apply Prisma migrations to test database
        run: pnpm --filter @dentabill/db exec prisma migrate deploy

      - name: Test (turbo)
        # `--concurrency=1` so packages that share the dentabill_test database
        # (currently `@dentabill/db` and `@dentabill/api`) do not race their
        # `truncate` cleanup hooks against each other. Cheap enough — the
        # per-package suites are sub-second.
        run: pnpm turbo run test --concurrency=1

  e2e:
    name: E2E (Playwright + axe + visual)
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 25

    env:
      NODE_ENV: test
      # Disable Next.js telemetry in CI.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright browsers — keyed on the @playwright/test version so
      # cache busts on upgrades. Without this, `playwright install` re-downloads
      # ~150 MB on every CI run.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(pnpm --filter @dentabill/web list --json --depth 0 @playwright/test \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const a=JSON.parse(s);const v=a[0]?.devDependencies?.["@playwright/test"]?.version;process.stdout.write(v||"")})')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dentabill/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @dentabill/web exec playwright install-deps chromium

      - name: Build Next.js app
        run: pnpm --filter @dentabill/web build

      - name: Run Playwright tests (chromium only on CI)
        run: pnpm --filter @dentabill/web exec playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  bundle:
    name: Bundle budget (apps/web)
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `quality` already runs turbo build; we re-build here so the bundle
      # check sees fresh .next/ artifacts on this runner. The marketing
      # surface builds in < 30s, so the duplication is cheap.
      - name: Build apps/web
        run: pnpm --filter @dentabill/web build

      - name: Enforce bundle budget (per-route ≤ 200 KB, total ≤ 350 KB)
        run: pnpm --filter @dentabill/web run check:bundle

  lighthouse:
    name: Lighthouse (perf + a11y + SEO budgets)
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        run: pnpm --filter @dentabill/web build

      - name: Boot next start in background
        run: |
          pnpm --filter @dentabill/web start &
          echo "BOOT_PID=$!" >> "$GITHUB_ENV"
          # Wait for the server to be reachable before lhci hits it.
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "next start is up"; break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/.lighthouserc.cjs
          # Provide a sane runtime cap so a hung audit doesn't burn the
          # whole timeout; the action defaults are reasonable but we set
          # explicitly for documentation.
          runs: 3
          uploadArtifacts: true

      - name: Stop next start
        if: always()
        run: |
          if [ -n "${BOOT_PID:-}" ]; then
            kill "$BOOT_PID" || true
          fi
